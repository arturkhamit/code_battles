[pytest]
# Run from backend/ against real Postgres and Redis, e.g. the dev containers:
#   POSTGRES_DB=cb POSTGRES_USER=cb POSTGRES_PASSWORD=cb_pw POSTGRES_HOST=127.0.0.1 \
#   POSTGRES_PORT=55432 REDIS_URL=redis://127.0.0.1:56379/0 pytest
# config.settings.test = local settings + throwaway secrets; DB and Redis come from the environment.
DJANGO_SETTINGS_MODULE = config.settings.test
pythonpath = .
python_files = tests.py test_*.py
asyncio_default_fixture_loop_scope = function
# backend/tests/ is the dataset folder (tests.json, download script), not a test suite.
testpaths = apps config
