[project]
name = "code-battles-backend"
version = "0.1.0"
description = "Code Battles: Django API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "django>=6.0.9,<6.1",
    "djangorestframework>=3.18.3",
    "djangorestframework-simplejwt>=5.5.1",
    "django-cors-headers>=4.9.0",
    "whitenoise>=6.12.0",
    "psycopg[binary]>=3.3.6",
    "redis>=7.3.0",
    "python-dotenv>=1.2.4",  # manage.py loads backend/.env
    "gunicorn>=23.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-django>=4.14.0",
    "pytest-asyncio>=1.4.1",
    "pyjwt>=2.15.1",
    "ruff>=0.8",
]
# backend/tests/main.py: downloads the code_contests dataset. Not for the image.
dataset = [
    "datasets>=4.8.4",
]

[tool.uv]
default-groups = ["dev"]
