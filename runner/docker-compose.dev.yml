# Local stack for the sandbox: the socket proxy and the runner. Not the project's compose
# (that is the dockerizer's job); it exists to run and test the runner as it will run in production.
#
#   docker build -f runner/sandbox/python/Dockerfile -t code-battles-sandbox-python:1 runner/sandbox
#   docker build -f runner/sandbox/cpp/Dockerfile    -t code-battles-sandbox-cpp:1    runner/sandbox
#   RUNNER_TOKEN=$(openssl rand -hex 32) docker compose -f runner/docker-compose.dev.yml up -d --build
#   curl http://127.0.0.1:8002/ready
#
# Port 8002 (RUNNER_PORT) is for FastAPI running on the host (RUNNER_URL=http://localhost:8002) and
# for curl. In production nothing is published: FastAPI reaches http://runner:8000 over an
# internal network.
name: code-battles-runner-dev

services:
  docker-proxy:
    # v0.5.0, pinned by digest. It filters endpoints, not request bodies: that is why the runner
    # builds every container spec itself (runner/app/spec.py) and why only the runner may talk to it.
    image: tecnativa/docker-socket-proxy:v0.5.0@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    restart: unless-stopped
    environment:
      CONTAINERS: "1"   # create / start / attach / wait / inspect / kill / remove, and listing for the reaper
      POST: "1"         # anything but GET: needed for create, start, kill, remove
      IMAGES: "1"       # inspect, so that /ready can see the sandbox images
      PING: "1"         # /_ping for /ready
      EVENTS: "0"
      VERSION: "0"      # the runner pins the API version instead of asking
      INFO: "0"
      EXEC: "0"
      VOLUMES: "0"
      NETWORKS: "0"
      BUILD: "0"
      COMMIT: "0"
      AUTH: "0"
      SECRETS: "0"
      SERVICES: "0"
      SWARM: "0"
      SYSTEM: "0"
      TASKS: "0"
      NODES: "0"
      PLUGINS: "0"
      CONFIGS: "0"
      DISTRIBUTION: "0"
      SESSION: "0"
      GRPC: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [sandbox-control]

  runner:
    build: .
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-local}
      RUNNER_TOKEN: ${RUNNER_TOKEN:?set RUNNER_TOKEN (32+ characters, e.g. openssl rand -hex 32)}
      SANDBOX_DOCKER_URL: tcp://docker-proxy:2375
      SANDBOX_PYTHON_IMAGE: ${SANDBOX_PYTHON_IMAGE:-code-battles-sandbox-python:1}
      SANDBOX_CPP_IMAGE: ${SANDBOX_CPP_IMAGE:-code-battles-sandbox-cpp:1}
      RUNNER_MAX_CONCURRENCY: ${RUNNER_MAX_CONCURRENCY:-4}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "127.0.0.1:${RUNNER_PORT:-8002}:8000"
    depends_on: [docker-proxy]
    networks: [sandbox-control, default]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 90s

networks:
  # No way out: the runner can talk to the proxy and nothing else on this network
  sandbox-control:
    internal: true
