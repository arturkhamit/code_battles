[pytest]
# Run from fastapi_app/ against a real Redis. Django is a fake (tests/fake_django.py) plugged in
# below django_callbacks, the sandbox is a fake runner, so no Postgres or Docker is needed:
#   TEST_REDIS_URL=redis://127.0.0.1:56381/15 pytest
# The tests FLUSHDB the database in TEST_REDIS_URL, which must be 15 (never a shared one).
pythonpath = .
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
# uvicorn 0.41 still serves WebSockets through the legacy websockets API
filterwarnings =
    ignore::DeprecationWarning:websockets
    ignore::DeprecationWarning:uvicorn
